[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.3.0",
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "accelerate>=0.26.0",
    "einops>=0.7.0",
    "pypdf>=4.0.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
